<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1F3B5A" />
  <title>修改密码</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="auth-page">
<div id="itck-demo-banner" style="position:sticky;top:0;z-index:999;background:#fff8c5;border-bottom:1px solid #d4a72c;color:#6b4e00;padding:8px 16px;font:13px/1.5 -apple-system,'Microsoft YaHei',sans-serif;text-align:center">
🧪 静态演示模式 · 数据保存在本机浏览器 · <a href="../index.html" style="color:#0969da">返回介绍页</a> · <a href="#" onclick="localStorage.removeItem('itck_demo_state_v1');location.reload();return false" style="color:#0969da">重置数据</a>
</div>

  <main class="auth-card">
    <div class="auth-logo">🔐</div>
    <div class="auth-brand">修改密码</div>
    <p id="hint" class="auth-sub">出于安全考虑，首次登录需设置新密码</p>
    <form id="cpForm" class="auth-form" autocomplete="off">
      <label class="field">
        <span>原密码</span>
        <input id="oldPassword" type="password" placeholder="请输入当前密码" autocomplete="current-password" />
      </label>
      <label class="field">
        <span>新密码</span>
        <input id="newPassword" type="password" placeholder="至少 6 位，建议字母 + 数字" autocomplete="new-password" />
      </label>
      <label class="field">
        <span>确认新密码</span>
        <input id="confirmPassword" type="password" placeholder="再次输入新密码" autocomplete="new-password" />
      </label>
      <div id="err" class="auth-err"></div>
      <button id="submit" class="btn primary" type="submit">确认修改</button>
    </form>
    <div class="auth-foot"><a href="#" id="logoutLink">退出登录</a></div>
  </main>
  <script src="./mock.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/change-password.js"></script>
  <script src="./js/demo-enhance.js"></script>
</body>
</html>
