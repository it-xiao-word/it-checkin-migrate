<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1F3B5A" />
  <title>机房打卡 · 登录</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="auth-page">
<div id="itck-demo-banner" style="position:sticky;top:0;z-index:999;background:#fff8c5;border-bottom:1px solid #d4a72c;color:#6b4e00;padding:8px 16px;font:13px/1.5 -apple-system,'Microsoft YaHei',sans-serif;text-align:center">
🧪 静态演示模式 · 数据保存在本机浏览器 · <a href="../index.html" style="color:#0969da">返回介绍页</a> · <a href="#" onclick="localStorage.removeItem('itck_demo_state_v1');location.reload();return false" style="color:#0969da">重置数据</a>
</div>

  <main class="auth-card">
    <div class="auth-logo">🛠️</div>
    <div class="auth-brand">IT机房运维 · 现场打卡</div>
    <p class="auth-sub">定位 · 拍照水印 · 设备巡检</p>
    <form id="loginForm" class="auth-form" autocomplete="off">
      <label class="field">
        <span>账号</span>
        <input id="username" type="text" placeholder="请输入登录账号" autocomplete="username" />
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
      </label>
      <div id="err" class="auth-err"></div>
      <button id="submit" class="btn primary" type="submit">登 录</button>
    </form>
    <div class="auth-tip">首次登录需修改初始密码；忘记密码请联系管理员重置。</div>
  </main>
  <script src="./mock.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
