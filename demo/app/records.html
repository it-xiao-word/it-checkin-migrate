<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1F3B5A" />
  <title>我的打卡记录</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="rec">
<div id="itck-demo-banner" style="position:sticky;top:0;z-index:999;background:#fff8c5;border-bottom:1px solid #d4a72c;color:#6b4e00;padding:8px 16px;font:13px/1.5 -apple-system,'Microsoft YaHei',sans-serif;text-align:center">
🧪 静态演示模式 · 数据保存在本机浏览器 · <a href="../index.html" style="color:#0969da">返回介绍页</a> · <a href="#" onclick="localStorage.removeItem('itck_demo_state_v1');location.reload();return false" style="color:#0969da">重置数据</a>
</div>

  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">我的打卡记录</div>
      <div class="topbar-sub" id="topSub">巡检留档 · 按日期查看</div>
    </div>
    <div class="top-actions">
      <a href="./" class="top-link">← 去打卡</a>
      <a href="./rack-topology.html" class="top-link" title="查看机柜连线拓扑">▤ 机柜拓扑</a>
      <button id="logoutBtn" class="topbtn" type="button">退出登录</button>
    </div>
  </header>

  <main class="wrap">
    <div class="stats">
      <div class="stat"><div class="k">本月打卡</div><div class="v" id="sMonth">—<span class="u">次</span></div></div>
      <div class="stat bad"><div class="k">本月异常</div><div class="v" id="sMonthBad">—<span class="u">次</span></div></div>
    </div>

    <section class="card chart-card">
      <div class="chart-head">
        <span class="chart-title">近 7 日打卡强度</span>
        <span class="chart-hint">柱高为当日次数，红色段为异常</span>
      </div>
      <div id="trend" class="spark-wrap">
        <div class="spark skel" style="height:96px;"></div>
      </div>
    </section>

    <div class="search-bar">
      <span class="s-ico">🔍</span>
      <input id="fKw" type="search" placeholder="搜索机房 / 巡检说明 / 备注" autocomplete="off" />
      <button id="fKwClear" class="s-clear" type="button" hidden aria-label="清空搜索">×</button>
    </div>

    <section class="card" style="padding:10px 14px;">
      <div class="acc" style="border:none;margin:0;">
        <div class="acc-head" id="filterToggle" style="padding:6px 0;background:none;">
          <span class="ico">🔎</span>
          <span class="t">筛选条件</span>
          <span class="n" id="filterInfo">全部记录</span>
          <span class="caret">▾</span>
        </div>
        <div class="acc-body" id="filterBody" style="padding:8px 0 4px;">
          <div class="preset-row" id="presets">
            <button class="chip-btn" type="button" data-range="today">今天</button>
            <button class="chip-btn" type="button" data-range="7">近 7 天</button>
            <button class="chip-btn" type="button" data-range="month">本月</button>
          </div>
          <div class="grid-2">
            <label class="field"><span>开始日期</span><input id="fFrom" type="date" /></label>
            <label class="field"><span>结束日期</span><input id="fTo" type="date" /></label>
            <label class="field"><span>机房 / 位置</span><select id="fLoc"><option value="">全部</option></select></label>
            <label class="chk"><input id="fBad" type="checkbox" /> 只看异常</label>
          </div>
          <div class="row" style="margin-top:6px;">
            <button class="btn ghost sm" id="searchBtn" type="button">查询</button>
            <button class="btn ghost sm" id="resetBtn" type="button">重置</button>
          </div>
        </div>
      </div>
    </section>

    <div class="bar">
      <span id="count" class="muted" style="font-size:12.5px;">共 0 条</span>
      <div class="bar-actions">
        <button class="btn ghost sm" id="exportBtn" type="button">📤 导出（可选周期）</button>
      </div>
    </div>

    <div id="recList" class="rec-list"></div>

    <div class="pager">
      <button class="btn ghost sm" id="prev" type="button">上一页</button>
      <span id="pageInfo">1 / 1</span>
      <button class="btn ghost sm" id="next" type="button">下一页</button>
    </div>
  </main>

  <div class="modal-mask" id="photoMask">
    <div class="modal">
      <div class="modal-head">
        <div class="t" id="photoTitle">打卡照片</div>
        <button class="modal-close" id="photoClose" type="button">×</button>
      </div>
      <div class="modal-body"><img class="big" id="photoBig" alt="打卡照片" /></div>
    </div>
  </div>

  <script src="./mock.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/records.js"></script>
  <script src="./js/demo-enhance.js"></script>
</body>
</html>
